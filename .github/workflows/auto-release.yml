name: Build & Auto Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-release:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Write signing key (falls back to committed keystore if no secrets)
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo "$KEY_STORE" | base64 --decode > key.jks
          else
            echo "No KEY_STORE secret -> using the committed waenhancer-release.keystore (fixed signature, updates install over)"
          fi

      - name: Bump versionCode & versionName per build (so APK updates install over, no uninstall needed)
        run: |
          BASE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -n 1)
          NEW_CODE=$((BASE + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode = [0-9]+/versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"1.6.6-build.$GITHUB_RUN_NUMBER\"/" app/build.gradle.kts
          echo "versionCode: $BASE -> $NEW_CODE | versionName -> 1.6.6-build.$GITHUB_RUN_NUMBER"
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build WhatsApp Release
        run: ./gradlew assembleWhatsappRelease

      - name: Prepare release tag
        id: prep
        run: |
          TAG="v1.6.6-build.${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=WaEnhancer $TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.title }}
          body_path: changelog.txt
          files: app/build/outputs/apk/whatsapp/release/WaEnhancer*.apk
          make_latest: true

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v7
        with:
          name: WaEnhancer-APK
          path: app/build/outputs/apk/whatsapp/release/WaEnhancer*.apk

      - name: Upload Proguard mapping
        uses: actions/upload-artifact@v7
        with:
          name: WaEnhancer-mapping
          path: app/build/outputs/mapping/whatsappRelease/mapping.txt
